<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2549</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container" style="max-width: 400px;">
        <h1 style="margin-bottom: 2rem;">2549</h1>

        <div class="card" style="padding: 2rem;">
            <button id="loginBtn" class="premium-btn" style="width: 100%; padding: 1.5rem;">Launch Resident
                Login</button>

            <div id="loaderContainer" class="hidden" style="margin-top: 2rem;">
                <div class="progress-bar">
                    <div id="progress" class="progress-fill"></div>
                </div>
                <p id="timer" style="margin-top: 1rem;">Opening Dashboard...</p>
            </div>

            <div id="resultContainer" class="hidden" style="margin-top: 2rem; text-align: center;">
                <h3 style="margin-bottom: 1rem; color: #fff;">Automation Result</h3>
                <div style="border: 2px solid rgba(255,255,255,0.1); border-radius: 12px; overflow: hidden;">
                    <img id="resultImg" src="" alt="Login Success" style="width: 100%; display: block;">
                </div>
            </div>
        </div>
    </div>

    <script>
        const loginBtn = document.getElementById('loginBtn');
        const loaderContainer = document.getElementById('loaderContainer');
        const resultContainer = document.getElementById('resultContainer');
        const resultImg = document.getElementById('resultImg');
        const progress = document.getElementById('progress');

        loginBtn.addEventListener('click', async () => {
            loginBtn.disabled = true;
            loginBtn.innerText = 'Automation Running...';
            loaderContainer.classList.remove('hidden');
            resultContainer.classList.add('hidden');

            let timeLeft = 6;
            const total = 6;
            const interval = setInterval(() => {
                timeLeft -= 0.1;
                progress.style.width = `${Math.min(((total - timeLeft) / total) * 100, 95)}%`;
                if (timeLeft <= 0) {
                    clearInterval(interval);
                }
            }, 100);

            try {
                const response = await fetch('/run-login');
                const result = await response.json();

                clearInterval(interval);
                progress.style.width = '100%';

                if (result.status === 'success') {
                    loginBtn.innerText = 'Login Successful!';
                    loginBtn.style.background = '#059669'; // Success green

                    // Show screenshot with cache busting
                    resultImg.src = 'login_success.png?t=' + new Date().getTime();
                    resultContainer.classList.remove('hidden');
                } else {
                    throw new Error(result.message || 'Unknown error');
                }

                setTimeout(() => {
                    loginBtn.disabled = false;
                    loginBtn.innerText = 'Launch Resident Login';
                    loginBtn.style.background = ''; // Reset
                    loaderContainer.classList.add('hidden');
                }, 3000);

            } catch (error) {
                clearInterval(interval);
                console.error('Error:', error);
                alert('Login failed: ' + error.message);
                loginBtn.disabled = false;
                loginBtn.innerText = 'Launch Resident Login';
                loaderContainer.classList.add('hidden');
            }
        });
    </script>
</body>

</html>
